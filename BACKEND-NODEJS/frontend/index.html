<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
  </head>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .card-container {
      display: grid;
      grid-template-columns: 3fr 3fr 3fr;
      place-items: start;
      align-items: center;

      max-width: 920px;
      height: auto;
      padding: 8px;
      margin: 0;
      left: 0;

      background-color: rgb(120, 119, 119);

      border: solid none;
      border-radius: 22px;
    }
    .product-img {
      width: 120px;
      height: 120px;
      border-radius: 18px;
      overflow: hidden;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .product-info {
      line-height: 0.5;
    }
    .product-status {
      position: relative;
      margin-left: 40px;
    }

    .product-status button {
      width: 80px;
      padding: 8px 0;
      border-radius: 30px;
      background-color: rgba(240, 236, 236, 0.789);
      color: black;
      border: none;
      cursor: pointer;
    }
  </style>
  <body>
    <div class="card-container">
      <div class="product-img">
        <img src="./assets/bread.jpg" alt="" />
      </div>
      <div class="product-info">
        <h1>Crossan</h1>
        <p>Soft - Regluar flavor</p>
        <p>$ 2.50</p>
      </div>
      <div class="product-status">
        <button class="btn">Buy</button>
      </div>
    </div>
  </body>
  <script></script>
</html>
