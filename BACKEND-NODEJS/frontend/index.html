<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
      }
      .product-card {
        width: min(100%, 330px);
        overflow: hidden;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 30px rgba(30, 41, 59, 0.15);
      }
      .product-image {
        height: 180px;
        overflow: hidden;
        background: #fee2b3;
      }
      .product-image img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .product-details {
        padding: 22px;
      }
      h1 {
        margin: 0 0 8px;
        color: #172033;
        font-size: 1.4rem;
      }
      .price {
        margin: 0 0 18px;
        color: #d97706;
        font-size: 1.25rem;
        font-weight: 700;
      }
      .buy-button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: #2563eb;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }
      .buy-button:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
      }
      .buy-button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <article class="product-card">
      <div class="product-image">
        <img src="./assets/bread.jpg" alt="Butter Croissant" />
      </div>
      <div class="product-details">
        <h1>Butter Croissant</h1>
        <p class="price" id="productPrice">$2.50</p>
        <button class="buy-button" type="button" id="buy-button">
          Buy now
        </button>
      </div>
    </article>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      const baseUrl = "http://localhost:3000";
      const price = document.getElementById("productPrice");
      async function handleBuyProduct() {
        const response = await fetch(
          baseUrl + "/api/v1/cardpayway/createCheckoutSession",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ price: 250 }),
          },
        );
        const data = await response.json();
        console.log(data);
        window.location.href = data.url;
      }
      const buyBtn = document.getElementById("buy-button");
      buyBtn.addEventListener("click", async () => {
        await handleBuyProduct();
      });
    </script>
  </body>
</html>
